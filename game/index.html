:root{color-scheme:dark;--ink:#0B0B0E;--ink2:#17171D;--ink3:#26262E;--paper:#F4F1EA;--yellow:#FFD60A;--yellowD:#A88A00;--red:#FF3B30;--redD:#9E1F18;--green:#2BD96B;--greenD:#168540;--blue:#2F7BFF;--gold:#F5B400;--muted:#9C978C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
html,body{background:#050507}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:480px;height:100%;background-color:var(--ink);background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding:10px 58px 8px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:3px solid var(--yellow);background:var(--ink);z-index:5}
.hud.off{display:none}
.h-day{font-family:Display;font-size:22px;color:var(--yellow);white-space:nowrap}
.h-day small{font-size:14px;color:var(--muted)}
.h-chips{display:flex;gap:5px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.h-chips span{background:var(--ink3);border-radius:999px;padding:4px 8px;font-weight:800;font-size:12.5px;white-space:nowrap}
@media (max-width:400px){.h-day{font-size:19px}.h-chips span{padding:3px 6px;font-size:11.5px}}
.mute{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:30;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink3);background:var(--ink2);font-size:18px;cursor:pointer;opacity:.75}
/* screen */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(64px + env(safe-area-inset-bottom));position:relative}
.screen.enter>*{animation:enter .38s cubic-bezier(.2,1.3,.4,1) both}
.screen.enter>*:nth-child(2){animation-delay:.05s}.screen.enter>*:nth-child(3){animation-delay:.1s}.screen.enter>*:nth-child(4){animation-delay:.15s}.screen.enter>*:nth-child(5){animation-delay:.2s}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:12px}
.center{text-align:center}
/* type */
.display{font-family:Display;line-height:1.02;margin:0}
.impact{font-family:Anton;text-transform:uppercase;letter-spacing:1px;line-height:1;margin:0}
.label{font-family:Anton;letter-spacing:2px;font-size:13px;color:var(--yellow);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.y{color:var(--yellow)}.g{color:var(--green)}.r{color:var(--red)}
/* buttons */
.btn{display:block;width:100%;font-family:Display;font-size:20px;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:13px 16px;box-shadow:0 6px 0 var(--yellowD);cursor:pointer;transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yellowD)}
.btn.paper{background:var(--paper);box-shadow:0 6px 0 #8f8a7e}
.btn.paper:active{box-shadow:0 1px 0 #8f8a7e}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 var(--redD)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--greenD)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--ink3);box-shadow:none}
.btn.sm{font-size:16px;padding:9px 12px;border-radius:12px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.btn .sub{display:block;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;opacity:.75;letter-spacing:0;margin-top:2px}
/* cards */
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;border:3px solid var(--ink);box-shadow:0 6px 0 #000}
.card .muted{color:#6d685e}
.panel{background:var(--ink2);border:2px solid var(--ink3);border-radius:16px;padding:14px}
/* avatars */
.av{--s:52px;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 #000}
.av span{font-family:Display;color:#fff;font-size:calc(var(--s)*.4);-webkit-text-stroke:calc(var(--s)*.07) var(--ink);paint-order:stroke fill;line-height:1}
.av i{position:absolute;right:-5px;bottom:-3px;font-style:normal;font-size:calc(var(--s)*.38);line-height:1}
.av.sm{--s:34px}.av.lg{--s:76px}.av.xl{--s:104px}
.av.out{filter:grayscale(1);opacity:.45}
/* title */
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;padding:10px 4px}
.kicker{font-family:Anton;letter-spacing:4px;font-size:13px;color:var(--muted)}
.logo{display:inline-flex;flex-direction:column;align-items:center;margin:6px auto 0;transform:rotate(-4deg)}
.logo b{font-family:Display;font-weight:400;font-size:84px;line-height:.86;color:var(--yellow);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--red)}
.logo b+b{color:var(--paper);font-size:76px}
.logo em{font-style:normal;font-family:Anton;background:var(--red);color:#fff;font-size:20px;letter-spacing:3px;padding:6px 12px;border:3px solid var(--ink);transform:rotate(3deg);margin-top:10px}
.pitch{font-size:16px;line-height:1.45;color:#d9d5cc}
.disc{font-size:11px;color:var(--muted);line-height:1.4}
.buzzer-deco{width:92px;height:46px;margin:0 auto;background:var(--red);border:4px solid var(--ink);border-radius:92px 92px 10px 10px;box-shadow:0 10px 0 #000,inset 0 -8px 0 var(--redD);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* setup */
input.name{width:100%;font-family:Display;font-size:24px;padding:12px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);outline:none}
input.name:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--ink)}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arch button{background:var(--ink2);border:3px solid var(--ink3);border-radius:16px;padding:12px 10px;text-align:left;cursor:pointer}
.arch button.on{border-color:var(--yellow);background:#2a2610}
.arch .em{font-size:30px}
.arch .t{font-family:Display;font-size:19px;margin:2px 0}
.arch .d{font-size:12px;color:#cfcac0;line-height:1.35}
/* host */
.host{display:flex;gap:12px;align-items:flex-start}
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.4;border:3px solid var(--ink);flex:1}
.bubble:before{content:"";position:absolute;left:-12px;top:16px;border:8px solid transparent;border-right-color:var(--paper)}
.bubble b{color:#c21c13}
/* cast grid */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;background:var(--ink2);border:2px solid var(--ink3);border-radius:16px;padding:10px 6px 9px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .nm{font-weight:800;font-size:13px;line-height:1.1}
.tile .tg{font-size:10.5px;color:var(--muted);line-height:1.1}
.tile .badge{position:absolute;top:5px;left:6px;font-size:14px}
.tile.dim{opacity:.55}
.rb{width:100%;height:6px;background:var(--ink3);border-radius:4px;overflow:hidden}
.rb i{display:block;height:100%;border-radius:4px}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--yellow)}
.pips i.used{background:var(--ink3);box-shadow:0 0 0 2px var(--ink3)}
.news{display:flex;flex-direction:column;gap:6px}
.news div{background:var(--ink2);border-left:4px solid var(--red);padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.35}
.offer{display:flex;gap:10px;align-items:center;background:#11301d;border:2px solid var(--green);border-radius:14px;padding:10px}
.offer .t{flex:1;font-size:14px;line-height:1.3}
.offer .btn{width:auto;font-size:15px;padding:8px 10px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
/* sheet */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:#000a;opacity:0;transition:opacity .2s}
.sheet-card{position:relative;background:var(--ink2);border-top:4px solid var(--yellow);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,1,.3,1);max-height:88%;overflow-y:auto}
.sheet.open .sheet-bg{opacity:1}.sheet.open .sheet-card{transform:none}
.stats{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;align-items:center}
.dots{display:flex;gap:3px}.dots i{width:12px;height:8px;border-radius:2px;background:var(--ink3)}.dots i.on{background:var(--yellow)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{font-size:17px;padding:11px 8px}
.say{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.4;border:3px solid var(--ink)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}

<body>
<div class="app" id="app">
  <canvas id="bgfx"></canvas>
  <header class="hud off" id="hud"></header>
  <main class="screen" id="screen"></main>
  <div class="sheet hidden" id="sheet"></div>
  <div id="toasts"></div>
  <canvas id="confetti"></canvas>
  <button class="mute" id="mute" aria-label="Sunet">🔊</button>
</div>
<script>
'use strict';
/* =========================================================
   BUZZ HOUSE: SEZONUL TĂU — fan game neoficial
   Un singur fișier. Fără dependențe. Merge pe telefon.
   Adaugă #debug în URL ca probele să se rezolve instant.
   ========================================================= */
const DEBUG = location.hash.includes('debug');

/* ---------- utilitare ---------- */
const $ = s => document.querySelector(s);
const screen = $('#screen'), sheetEl = $('#sheet');
// R() e generatorul aleator al jocului. În mod normal e Math.random, dar seeded() îl face reproductibil:
// același cod de sezon = aceeași distribuție, ediție, twist-uri și aceleași scoruri ale adversarilor.
let R = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seeded(seed, fn) { const prev = R; R = mulberry32(seed >>> 0); try { return fn(); } finally { R = prev; } }
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (R() + R() + R() - 1.5) * 2;
const sleep = ms => new Promise(r => setTimeout(r, DEBUG ? Math.min(ms, 30) : ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtE = v => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '€';
const fmtK = k => k >= 1000 ? (k / 1000).toFixed(1).replace('.', ',') + 'M' : Math.round(k) + 'K';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- sunet (sintetizat, zero fișiere) ---------- */
let ac = null, muted = store.get('bh-muted', false);
function actx() { if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, dur, type = 'sine', vol = .14, slide = 0, delay = 0) {
  if (muted) return; const c = actx(); if (!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .15, freq = 1200, delay = 0) {
  if (muted) return; const c = actx(); if (!c) return;
  const t = c.currentTime + delay, len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const sfx = {
  click() { tone(720, .05, 'square', .05); },
  go() { tone(990, .09, 'square', .1); },
  buzz() { tone(140, .32, 'sawtooth', .16); tone(147, .32, 'square', .08); },
  ding() { tone(880, .1, 'sine', .14); tone(1320, .18, 'sine', .12, 0, .08); },
  wrong() { tone(220, .28, 'square', .1, -120); },
  pad(i) { tone([392, 523, 659, 784][i], .28, 'triangle', .18); },
  whoosh() { noise(.3, .18, 1800); },
  boom() { tone(85, .9, 'sine', .55, -50); noise(.35, .25, 500); vib(120); },
  steal() { tone(500, .12, 'square', .1, -300); tone(350, .2, 'square', .1, -200, .12); vib([40, 30, 80]); },
  twist() { [880, 660, 880, 660, 1320].forEach((f, i) => tone(f, .13, 'square', .09, 0, i * .14)); vib([60, 40, 60, 40, 160]); },
  kick(d = 0) { tone(150, .16, 'sine', .55, -110, d); },
  hat(d = 0) { noise(.035, .07, 9000, d); },
  bass(f, d = 0) { tone(f, .22, 'triangle', .16, 0, d); },
  heart() { tone(58, .11, 'sine', .45); tone(52, .1, 'sine', .35, 0, .14); },
  step() { noise(.09, .35, 260); },
  tick() { tone(1400, .025, 'square', .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .16, 0, i * .11)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, .32, 'triangle', .14, 0, i * .16)); },
  scream() { tone(900, .7, 'sawtooth', .18, 700); noise(.7, .3, 3000); vib([200, 60, 300]); },
};
function vib(p) { if (muted) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
$('#mute').textContent = muted ? '🔇' : '🔊';
$('#mute').onclick = () => { muted = !muted; store.set('bh-muted', muted); $('#mute').textContent = muted ? '🔇' : '🔊'; };

/* ---------- date: distribuția ---------- */
// Statistici de joc (1-10): know=cultură, refl=reflexe, endu=anduranță, mem=memorie.
// soc: charm=simpatie, loyal=loialitate, drama=chef de scandal, strat=joc strategic.
const ROSTER = [
  { id: 'costi', name: 'Costi Max', sn: 'Costi', tag: 'Actorul', emoji: '🎭', color: '#FF3B30', fame: 900,
    st: { know: 6, refl: 6, endu: 6, mem: 7 }, soc: { charm: 9, loyal: 7, drama: 4, strat: 8 },
    lines: ['Frate, aici e film, nu reality. Și eu sunt protagonistul.', 'Relaxează-te. Știu cum se termină sezonul ăsta.'] },

const rel = (a, b) => G.rel[rk(idOf(a), idOf(b))] || 0;
function addRel(a, b, d) { const k = rk(idOf(a), idOf(b)); G.rel[k] = clamp((G.rel[k] || 0) + d, -100, 100); }
const allied = (a, b) => G.allies.has(rk(idOf(a), idOf(b)));
const byId = id => G.cast.find(c => c.id === id);

const threat = c => c.wins * 10 + prizeVal(c) / 300 + c.hype / 8;

function newGame(name, arch, ed, m) {
  const you = { id: 'you', isYou: true, name, sn: name, tag: ARCH[arch].name, emoji: ARCH[arch].emoji, color: '#FFD60A', arch,
    fame: ARCH[arch].fame, hype: 0, wins: 0, cash: 0, alive: true };
  // tot ce ține de „ce sezon e” vine din cod: aceeași distribuție, relații, probe, twist-uri și rival
  seeded(m.seed, () => {
    const npcs = shuffle(ROSTER).slice(0, 9).map(r => ({ ...r, hype: 0, wins: 0, cash: 0, alive: true }));
    G = { day: 0, ed, seed: m.seed, mode: m.mode, target: m.target || null, dailyNo: m.no || null,
      you, cast: [you, ...npcs], rel: {}, allies: new Set(), prizes: [], elim: [], grudge: {}, news: [], offers: [],
      fx: {}, card: 0, usedQ: new Set(), usedE: new Set(), immune: null, place: null, today: null,
      stats: { steals: 0, dramas: 0, chip: 0, card: 0, nemesis: 0, peace: 0 } };
    for (const a of npcs) {
      addRel(a, you, ri(-8, 12));
      for (const b of npcs) if (a.id < b.id) addRel(a, b, ri(-15, 25));
    }
    // 7 probe din 9; frânghia apare mereu (e și finala), „Cine a zis-o?” nu în primele două zile
    const s = shuffle([...shuffle(['buzz', 'quiz', 'math', 'memory', 'likes', 'quote', 'dance', 'mole']).slice(0, 6), 'rope']);
    const qi = s.indexOf('quote'); if (qi > -1 && qi < 2) { [s[qi], s[4]] = [s[4], s[qi]]; }
    G.schedule = s;
    G.twists = planTwists();
    // rivalul: cel mai pus pe scandal (cu puțin noroc) te ia la țintă tot sezonul
    const rv = npcs.map(c => ({ c, s: c.soc.drama + R() * 4 })).sort((a, b) => b.s - a.s)[0].c;
    G.rival = rv.id; addRel(rv, you, -20);
  });
}

async function houseMap() {
  openSheet(`<div class="stack"><div class="label">🕸️ Harta casei</div><canvas id="hm" style="width:100%;max-width:100%;aspect-ratio:1"></canvas>
    <div class="small muted" style="line-height:1.55"><b class="g">━━</b> alianță &nbsp;·&nbsp; <b class="r">╍╍</b> dușmănie &nbsp;·&nbsp; inelul fiecăruia: ce crede despre tine${G.rivalKnown && G.rival ? ' &nbsp;·&nbsp; 🎯 rivalul tău' : ''}</div>
    <button class="btn" data-act="close">ÎNCHIDE</button></div>`);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const cv = $('#hm'), W = cv.clientWidth, dpr = Math.min(2, devicePixelRatio || 1), x = cv.getContext('2d');
  cv.width = W * dpr; cv.height = W * dpr; x.scale(dpr, dpr);
  const npcs = aliveNPC(), cx = W / 2, cy = W / 2, RR = W * .37, nr = Math.max(16, W * .062);
  const P = new Map([['you', { x: cx, y: cy }]]);
  npcs.forEach((c, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / npcs.length; P.set(c.id, { x: cx + RR * Math.cos(a), y: cy + RR * Math.sin(a) }); });
  const relCol = v => v > 20 ? '#2BD96B' : v < -20 ? '#FF3B30' : '#9C978C';
  const line = (a, b, col, w, dash) => { x.save(); x.strokeStyle = col; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); x.restore(); };
  // între ei: alianțe și dușmănii
  for (let i = 0; i < npcs.length; i++) for (let j = i + 1; j < npcs.length; j++) {
    const a = npcs[i], b = npcs[j];
    if (allied(a, b)) line(P.get(a.id), P.get(b.id), 'rgba(43,217,107,.85)', 3.5);
    else if (rel(a, b) < -30) line(P.get(a.id), P.get(b.id), 'rgba(255,59,48,.75)', 2, [6, 5]);
  }
  // de la tine spre fiecare
  for (const c of npcs) { const v = rel(G.you, c); line(P.get('you'), P.get(c.id), allied(G.you, c) ? 'rgba(43,217,107,.9)' : relCol(v) + '55', allied(G.you, c) ? 4 : 1.5, v < -20 ? [3, 4] : null); }
  const node = (c, p, ring) => {
    x.beginPath(); x.arc(p.x, p.y, nr + 4, 0, 6.283); x.fillStyle = ring; x.fill();
    x.beginPath(); x.arc(p.x, p.y, nr, 0, 6.283); x.fillStyle = c.color; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#0B0B0E'; x.stroke();
    x.font = `800 ${Math.round(nr * .78)}px Display, system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
    const t = c.isYou ? 'TU' : initials(c.name); x.lineWidth = 4; x.strokeText(t, p.x, p.y + 1); x.fillStyle = '#fff'; x.fillText(t, p.x, p.y + 1);
    if (!c.isYou) { x.font = '700 11px system-ui, sans-serif'; x.fillStyle = '#F4F1EA'; x.fillText(c.sn, p.x, p.y + nr + 15); }
    if (c.id === G.rival && G.rivalKnown) { x.font = `${Math.round(nr * .8)}px system-ui`; x.fillText('🎯', p.x + nr * .9, p.y - nr * .8); }
  };
  for (const c of npcs) node(c, P.get(c.id), relCol(rel(G.you, c)));
  node(G.you, P.get('you'), '#FFD60A');
  await waitAct(sheetEl); await closeSheet();
}

function npcNominate(n, immuneId, preview = false) {
  const opts = aliveAll().filter(c => c !== n && c.id !== immuneId && !(c.isYou && G.youImm));
  let best = null, bs = -1e9;
  for (const c of opts) {
    let s = -rel(n, c) + (n.soc.strat / 10) * threat(c) + (preview ? 0 : gauss() * 8) + (n.id === G.rival && c.isYou ? 30 : 0);
    if (allied(n, c)) s -= (n.soc.loyal >= 6 || rel(n, c) > -10) ? 70 : 10;
    if (s > bs) { bs = s; best = c; }
  }
  return best;
}
async function elimination(round2 = false) {
  // twist: imunitatea se cumpără cu cel mai scump premiu

    const best = G.prizes.filter(p => p.owner === 'you').sort((a, b) => b.v - a.v)[0];
    if (best) {
      show(`<div class="stack center"><div class="label">⚡ Imunitate la vânzare</div><div style="font-size:64px">${best.e}</div>
        ${host(`Îmi dai <b>${esc(best.n)}</b> (${fmtE(best.v)}) și în seara asta nimeni nu te poate nominaliza. Batem palma?`)}

    }
    G.sale = false;
  }
  const youImm = G.immune === 'you' || G.youImm;

    <div class="label">🌙 ${round2 ? 'A doua eliminare' : 'Seara nominalizărilor'}</div>

    ${!round2 && !(L && L.isYou) ? host(youImm ? 'Ai imunitate, deci ești în siguranță. Dar votezi. <b>Pe cine nominalizezi?</b>' : 'Fiecare nominalizează pe cineva. Cei mai votați doi ajung la votul publicului. <b>Pe cine nominalizezi?</b>') : ''}
    <div class="grid3">${elig.map(c => `<div class="tile" data-act="nom" data-id="${c.id}">${allied(G.you, c) ? '<span class="badge">🤝</span>' : ''}${av(c)}<div class="nm">${esc(c.sn)}</div>${relBar(rel(G.you, c))}</div>`).join('')}</div>
    ${G.immune && G.immune !== 'you' ? `<div class="small muted center">🛡️ ${esc(byId(G.immune).sn)} are imunitate.</div>` : ''}
  </div>`);
  const r = await waitAct();
  const myT = byId(r.id);
  addRel('you', myT, -12);
  if (allied('you', myT)) { G.allies.delete(rk('you', myT.id)); addRel('you', myT, -20); }
  const votes = [{ v: G.you, t: myT }];
  for (const n of aliveNPC()) {
    const t = npcNominate(n, G.immune);
    if (t) { votes.push({ v: n, t }); if (allied(n, t)) { G.allies.delete(rk(n.id, t.id)); G.news.push(`💔 TRĂDARE: ${esc(n.sn)} și-a nominalizat aliatul, ${esc(nm(t))}!`); } addRel(n, t, -6); }
  }
  const tally = {}; for (const x of votes) tally[x.t.id] = (tally[x.t.id] || 0) + 1;
  const ranked = Object.keys(tally).map(byId).sort((a, b) => tally[b.id] - tally[a.id] || a.hype - b.hype || Math.random() - .5);
  const lp = L && L.alive ? (L.isYou ? myT : npcNominate(L, G.immune, true)) : null;
  let noms = lp ? [lp, ranked.find(c => c !== lp)].filter(Boolean) : ranked.slice(0, 2);
  if (noms.length < 2) noms.push(shuffle(aliveAll().filter(c => c.id !== G.immune && !(c.isYou && G.youImm) && !noms.includes(c)))[0]);
  show(`<div class="stack">
    <div class="label">🌙 Voturile</div>
    ${lp ? `<div class="panel small">👑 Șeful Casei (${esc(nm(L))}) l-a trimis direct la vot pe <b>${esc(nm(lp))}</b>.</div>` : ''}
    <div>${votes.map((x, i) => `<div class="nomrow" style="animation-delay:${i * .18}s">${av(x.v, 'sm')}<span>${esc(x.v.isYou ? 'Tu' : x.v.sn)}</span><span class="arr">→</span>${av(x.t, 'sm')}<span>${esc(nm(x.t))}</span></div>`).join('')}</div>
    <div class="tally" style="animation-delay:${votes.length * .18}s">${ranked.map(c => `<div>${av(c, 'sm')}${tally[c.id]}</div>`).join('')}</div>
    <button class="btn" data-act="go" style="animation-delay:${votes.length * .18 + .2}s">NOMINALIZAȚII →</button>
  </div>`);
  for (let i = 0; i < votes.length; i++) setTimeout(() => votes[i].t.isYou ? sfx.wrong() : sfx.tick(), DEBUG ? 0 : i * 180);
  await waitAct();
  // cartea de salvare
  if (noms.some(c => c.isYou) && G.card > 0) {
    show(`<div class="stack center"><div class="label">🃏 Ești nominalizat</div>${host('Ai o <b>Carte de salvare</b>. O folosești acum? Locul tău îl ia următorul cel mai votat.')}
      <button class="btn green" data-act="use">FOLOSESC CARTEA 🃏</button><button class="btn paper" data-act="no">Risc la votul publicului</button></div>`);
    const u = await waitAct();
    if (u.act === 'use') {
      G.card--; G.stats.card++; const next = ranked.find(c => !noms.includes(c) && !c.isYou) || shuffle(aliveNPC().filter(c => c.id !== G.immune && !noms.includes(c)))[0];
      noms = noms.map(c => c.isYou ? next : c); sfx.ding(); toast('🃏 Te-ai salvat!');
    }
  }
  const [A, B] = noms;

      ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 8; ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.moveTo(W * .5, ty); ctx.lineTo(W * .5, ty + th); ctx.stroke(); ctx.setLineDash([]);
      // zona
      const zy = ty + th * (1 - zc - zs / 2), zh = th * zs;
      ctx.fillStyle = inZ ? 'rgba(43,217,107,.55)' : 'rgba(43,217,107,.3)'; rr(tx + 3, zy, tw - 6, zh, 10); ctx.fill();
      ctx.strokeStyle = '#2BD96B'; ctx.lineWidth = 3; rr(tx + 3, zy, tw - 6, zh, 10); ctx.stroke();
      // mâna
      const my = ty + th * (1 - m);
      ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✊', W * .5, my);
      // puterea
      const bx = W - 26, bh = th;
      ctx.fillStyle = '#26262E'; rr(bx, ty, 14, bh, 7); ctx.fill();
      ctx.fillStyle = stam < .3 ? '#FF3B30' : '#FFD60A'; rr(bx, ty + bh * (1 - stam), 14, bh * stam, 7); ctx.fill();
      ctx.fillStyle = '#9C978C'; ctx.font = '700 11px system-ui'; ctx.save(); ctx.translate(bx - 10, ty + bh / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('PUTERE', 0, 0); ctx.restore();
      if (!inZ) { ctx.fillStyle = 'rgba(255,59,48,.12)'; ctx.fillRect(0, 0, W, H); }
    };
    const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };
    requestAnimationFrame(frame);
  });
}

async function gameQuote() {
  const people = G.cast.filter(c => !c.isYou);
  const rounds = shuffle(people.flatMap(c => c.lines.map(l => ({ c, l })))).slice(0, 6), T = perk('nerd') ? 10 : 7;
  let total = 0;
  for (let i = 0; i < rounds.length; i++) {
    const { c, l } = rounds[i], opts = shuffle([c, ...shuffle(people.filter(o => o !== c)).slice(0, 3)]);
    show(`<div class="mg"><div class="mg-top"><span class="pill">REPLICA ${i + 1}/${rounds.length}</span><span class="pill big">${total}</span></div>
      <div class="timer"><i id="qt"></i></div>
      <div class="say" style="font-size:20px;min-height:96px">„${esc(l)}”</div>
      <div class="opts">${opts.map((o, j) => `<button class="opt quote-opt" data-act="a" data-id="${j}">${av(o, 'sm')}<span>${esc(o.sn)}</span></button>`).join('')}</div></div>`);
    const start = performance.now();
    const res = await new Promise(r => {
      let done = false;
      const on = e => { const b = e.target.closest('[data-act="a"]'); if (!b || done) return; done = true; screen.removeEventListener('click', on); r({ j: +b.dataset.id, left: Math.max(0, T - (performance.now() - start) / 1000) }); };
      screen.addEventListener('click', on);
      const tick = () => { if (done) return; const left = T - (performance.now() - start) / 1000, bar = $('#qt'); if (bar) bar.style.width = Math.max(0, left / T * 100) + '%'; if (left <= 0) { done = true; screen.removeEventListener('click', on); r({ j: -1, left: 0 }); } else requestAnimationFrame(tick); };
      tick();
    });
    screen.querySelectorAll('.opt').forEach((el, j) => { if (opts[j] === c) el.classList.add('ok'); else if (j === res.j) el.classList.add('no'); });

async function gameDance() {
  const BPM = 116, beat = 60 / BPM, LEN = 20, LEAD = 1.6, TRAVEL = 1.35;
  const LANES = [{ a: '←', c: '#FFD60A', k: ['KeyD', 'ArrowLeft'], f: 523 }, { a: '↓', c: '#FF3B30', k: ['KeyF', 'ArrowDown'], f: 587 }, { a: '↑', c: '#2BD96B', k: ['KeyJ', 'ArrowUp'], f: 659 }, { a: '→', c: '#2F7BFF', k: ['KeyK', 'ArrowRight'], f: 784 }];
  const notes = []; let lastLane = -1;
  for (let t = LEAD + 2 * beat; t < LEN - .4; t += beat) {
    if (Math.random() < .84) { let l; do l = ri(0, 3); while (l === lastLane && Math.random() < .7); lastLane = l; notes.push({ t, l }); }
    if (t > LEN * .45 && Math.random() < .3) { let l = ri(0, 3); if (l === lastLane) l = (l + 1) % 4; notes.push({ t: t + beat / 2, l }); }
  }
  show(`<div class="mg dance"><div class="mg-top"><span class="pill big" id="dt">${LEN}.0s</span><span class="pill big" id="ds">0 p</span></div>
    <canvas id="dc"></canvas>
    <div class="lanes">${LANES.map((L, i) => `<button class="lane-btn" data-l="${i}" style="background:${L.c}">${L.a}</button>`).join('')}</div></div>`);
  const cv = $('#dc'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const hitY = H - 46, lw = W / 4;
  let score = 0, combo = 0, judge = null;
  // muzica: kick pe fiecare timp, hi-hat pe contratimp, linie de bas pe 4 măsuri
  const BASS = [110, 110, 131, 98];
  for (let k = 0; k * beat < LEN; k++) { sfx.kick(k * beat); sfx.hat(k * beat + beat / 2); if (k % 2 === 0) sfx.bass(BASS[Math.floor(k / 4) % 4], k * beat); }
  const t0 = performance.now();
  const now = () => (performance.now() - t0) / 1000;
  const press = l => {
    const b = screen.querySelector(`.lane-btn[data-l="${l}"]`); if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 90); }
    const t = now(); let best = null;
    for (const n of notes) if (!n.done && n.l === l && Math.abs(n.t - t) < .16 && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n;
    if (!best) { combo = 0; return; }
    best.done = true; const d = Math.abs(best.t - t);
    const pts = d < .06 ? 3 : 1; score += pts; combo++;
    judge = { txt: pts === 3 ? 'PERFECT' : 'BINE', c: pts === 3 ? '#FFD60A' : '#F4F1EA', t, l };
    tone(LANES[l].f, .09, 'triangle', .1);
    $('#ds').textContent = score + ' p';
  };
  const down = e => { const b = e.target.closest('.lane-btn'); if (!b) return; e.preventDefault(); press(+b.dataset.l); };
  const key = e => { if (e.repeat) return; const l = LANES.findIndex(L => L.k.includes(e.code)); if (l > -1) { e.preventDefault(); press(l); } };
  screen.addEventListener('pointerdown', down); addEventListener('keydown', key);
  return new Promise(resolve => {
    const frame = () => {
      const t = now();
      if (t >= LEN) { screen.removeEventListener('pointerdown', down); removeEventListener('keydown', key); sfx.buzz(); resolve(score); return; }
      $('#dt').textContent = (LEN - t).toFixed(1) + 's';
      for (const n of notes) if (!n.done && !n.miss && t - n.t > .16) { n.miss = true; combo = 0; judge = { txt: 'RATAT', c: '#FF3B30', t, l: n.l }; }
      ctx.clearRect(0, 0, W, H);
      const pulse = 1 - ((t % beat) / beat);
      for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.025)' : 'rgba(255,255,255,.05)'; ctx.fillRect(i * lw, 0, lw, H); }
      ctx.fillStyle = `rgba(255,255,255,${.25 + .35 * pulse})`; ctx.fillRect(0, hitY - 2, W, 4);
      for (let i = 0; i < 4; i++) { ctx.strokeStyle = LANES[i].c; ctx.globalAlpha = .5; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(i * lw + 8, hitY - 24, lw - 16, 48, 12) : ctx.rect(i * lw + 8, hitY - 24, lw - 16, 48); ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const n of notes) {
        if (n.done || n.miss) continue;
        const y = hitY - (n.t - t) / TRAVEL * hitY; if (y < -40 || y > H + 40) continue;
        ctx.fillStyle = LANES[n.l].c; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(n.l * lw + 10, y - 22, lw - 20, 44, 12) : ctx.rect(n.l * lw + 10, y - 22, lw - 20, 44); ctx.fill();
        ctx.fillStyle = '#0B0B0E'; ctx.font = '900 28px system-ui, sans-serif'; ctx.fillText(LANES[n.l].a, n.l * lw + lw / 2, y + 1);
      }
      if (judge && t - judge.t < .5) { ctx.globalAlpha = 1 - (t - judge.t) / .5; ctx.fillStyle = judge.c; ctx.font = '800 30px Display'; ctx.fillText(judge.txt, judge.l * lw + lw / 2, hitY - 70 - (t - judge.t) * 60); ctx.globalAlpha = 1; }
      if (combo >= 5) { ctx.fillStyle = '#F4F1EA'; ctx.font = '800 26px Display'; ctx.fillText(`COMBO ×${combo}`, W / 2, 34); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}

async function gameMole() {
  const T = 20; let score = 0;
  show(`<div class="mg"><div class="mg-top"><span class="pill big" id="pt">${T}.0s</span><span class="pill big" id="ps">0 📸</span></div>
    <div class="moles">${Array.from({ length: 9 }, (_, i) => `<button class="mole" data-m="${i}"><span></span></button>`).join('')}</div>
    <div class="mg-hint">📸 paparazzi +1 · ⭐ Selly +3 · 🙋 fan −2</div></div>`);
  const cells = [...screen.querySelectorAll('.mole')], state = cells.map(() => null);
  const flash = (el, cls) => { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 160); };
  cells.forEach((el, i) => el.addEventListener('pointerdown', e => {
    e.preventDefault(); const s = state[i]; if (!s) return;
    state[i] = null; el.classList.remove('up');
    const d = s.k === 'p' ? 1 : s.k === 's' ? 3 : -2; score = Math.max(0, score + d);
    if (d > 0) { tone(s.k === 's' ? 1320 : 940, .07, 'square', .08); flash(el, 'hit'); } else { sfx.wrong(); flash(el, 'bad'); vib(60); }
    $('#ps').textContent = score + ' 📸';
  }));
  const start = performance.now(); let spawn = .3, last = start;
  return new Promise(resolve => {
    const frame = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now; const el = (now - start) / 1000, k = el / T;
      if (el >= T) { sfx.buzz(); resolve(score); return; }
      $('#pt').textContent = (T - el).toFixed(1) + 's';
      spawn -= dt;
      if (spawn <= 0) {
        spawn = .62 - .3 * k;
        const free = state.map((s, i) => s ? -1 : i).filter(i => i > -1);
        if (free.length) {
          const i = pick(free), r = Math.random(), kind = r < .1 ? 's' : r < .34 ? 'f' : 'p';
          state[i] = { k: kind, until: el + (1.05 - .45 * k) };
          cells[i].firstChild.textContent = kind === 'p' ? '📸' : kind === 's' ? '⭐' : '🙋'; cells[i].classList.add('up');
        }
      }
      state.forEach((s, i) => { if (s && el > s.until) { state[i] = null; cells[i].classList.remove('up'); } });
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}

function confetti(n = 120) {
  const cv = $('#confetti'), ctx = cv.getContext('2d'), app = $('#app'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = app.clientWidth, H = app.clientHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FFD60A', '#FF3B30', '#2BD96B', '#2F7BFF', '#F4F1EA'];
  const ps = Array.from({ length: n }, () => ({ x: rnd(0, W), y: rnd(-H * .4, -10), vx: rnd(-60, 60), vy: rnd(120, 320), r: rnd(0, 6), vr: rnd(-8, 8), w: rnd(6, 11), h: rnd(10, 16), c: pick(cols) }));
  let last = performance.now(), t = 0;
  const f = now => { const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    t < 3.5 ? requestAnimationFrame(f) : ctx.clearRect(0, 0, W, H); };
  requestAnimationFrame(f);
}

async function season() {
  const m = await titleScreen(), ed = edOf(m.seed);
  applyEd(ed);
  await setupScreen(ed, m);
  await introScreen();
  for (G.day = 1; G.day <= 7; G.day++) {
    G.today = { ...ED().prizes[G.day - 1] };
    Object.assign(G, { immune: null, youImm: false, leader: false, sale: false, double: false, dayWinner: null });
    await dayCard();
    const tw = TWISTS[G.twists[G.day]];
    if (tw && tw.ok()) await twistCard(tw);
    if (G.day === 2 && G.rival && byId(G.rival).alive) {
      G.rivalKnown = true;
      G.news.unshift(`🎯 <b>ZVON:</b> ${esc(byId(G.rival).sn)} te-a ales drept țintă pentru tot sezonul. Te va nominaliza și îți va vâna premiile. Poți încerca să faci pace.`);
    }
    await morning();
    await eventPhase();
    await challengePhase();
    if (G.day >= 2) {
      if (await elimination() === 'you') return endScreen();
      if (G.double && aliveAll().length > 4 && await elimination(true) === 'you') return endScreen();
    }
    if (chipDays().includes(G.day)) await chipNight();
    simHouse();
  }
  G.day = 8; G.immune = null;
  await dayCard();
  await finale();
  await endScreen();
}
